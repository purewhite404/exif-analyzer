<!DOCTYPE html>
<html>
<head>
  <style>
    .description {
      width: 800px;
      display: grid;
      grid-template-columns: 400px auto;
    }
    .exifcell {
      padding: 0.2em;
      display: flex;
    }
    .right {
      justify-content: end;
    }
    .exifelement {
      padding: 0.2em;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
  <script src="main.js"></script>
</head>
<body>
  <main></main>
  <script>
    var app = Elm.Main.init({ node: document.querySelector('main') });
    // you can use ports and stuff here
    app.ports.analyzeExif.subscribe(function (image) {
      var img = new Image();
      img.onload = function(){
        EXIF.getData(img, function() {
          var exif = EXIF.getAllTags(this);
          console.log(exif);
          app.ports.getExif.send(JSON.stringify(exif));
        });
      };
      img.src = image;
    });
  </script>
</body>
</html>
